<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Informes Gobernación</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Informes Gobernación</a>
        <div>
            {% if user %}
                <span class="navbar-text me-2">Bienvenido {{ user.nombre }} ({{ user.rol }})</span>
                <a class="btn btn-sm btn-light" href="{{ url_for('logout') }}">Salir</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-info">
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
